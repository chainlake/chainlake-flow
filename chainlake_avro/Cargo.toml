[package]
name = "chainlake-avro"
version = "0.1.0"
edition = "2021"
description = "PyO3 extension for GIL-free parallel Avro encoding (chainlake-flow)"

[lib]
name = "chainlake_avro"
crate-type = ["cdylib"]

[dependencies]
pyo3     = { version = "0.22", features = ["extension-module"] }
# apache-avro: schema parsing + binary encoding (no compression features needed)
apache-avro = { version = "0.16", default-features = false }
rayon    = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto       = "fat"
codegen-units = 1
strip     = true
