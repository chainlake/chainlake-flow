name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Only one deploy runs at a time. A new push cancels the in-progress run
# so we never have two CI jobs racing on the same ArgoCD application.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_REGISTRY }}/chainlake/chainlake-rpcstream
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via ArgoCD
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v3.4.3/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          ARGOCD_COMMON=(
            --server argocd.chainlake.io
            --grpc-web
            --header "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}"
            --header "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
            --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}"
          )

          # app_set <app>: wait for any running operation to clear, then set
          # the new image override. Retries up to 5× with increasing backoff
          # to handle the selfHeal race: selfHeal can start a new sync in the
          # gap between wait returning and app set running.
          # No explicit app sync needed — selfHeal=true picks up the new image.
          app_set() {
            local app=$1
            local image_override=$2
            local delay=5
            for attempt in 1 2 3 4 5; do
              argocd app wait "$app" "${ARGOCD_COMMON[@]}" --operation --timeout 120 || true
              if argocd app set "$app" "${ARGOCD_COMMON[@]}" \
                  --kustomize-image "$image_override"; then
                echo "$app: image override set (attempt $attempt)"
                return 0
              fi
              echo "$app: app set failed (attempt $attempt), retrying in ${delay}s..."
              sleep $delay
              delay=$((delay * 2))
            done
            echo "$app: all attempts failed" >&2
            return 1
          }

          IMAGE="chainlake-rpcstream=${{ steps.meta.outputs.tags }}"
          app_set rpcstream         "$IMAGE"
          app_set rpcstream-dlq-replay "$IMAGE"
