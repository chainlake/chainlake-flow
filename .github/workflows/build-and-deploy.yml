name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_REGISTRY }}/chainlake/chainlake-rpcstream
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via ArgoCD
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v3.4.3/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          ARGOCD_COMMON=(
            --server argocd.chainlake.io
            --grpc-web
            --header "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}"
            --header "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
            --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}"
          )
          # Wait for any in-flight sync to finish before setting the new image
          # override. Using --operation (not terminate-op) so we don't disrupt
          # a valid sync that's still converging. selfHeal can re-trigger between
          # terminate-op and app set, making terminate-op a race; wait is safer.
          argocd app wait rpcstream "${ARGOCD_COMMON[@]}" --operation --timeout 120 || true
          argocd app set rpcstream "${ARGOCD_COMMON[@]}" \
            --kustomize-image "chainlake-rpcstream=${{ steps.meta.outputs.tags }}"
          argocd app sync rpcstream "${ARGOCD_COMMON[@]}" --async
          # rpcstream-dlq-replay (Argo Workflows CronWorkflow, apps/rpcstream-dlq-replay
          # in chainlake-infra) is a separate ArgoCD Application from `rpcstream`, so it
          # needs its own image override -- otherwise it stays pinned to the
          # unpublished `:latest` tag in git and every run ErrImagePulls.
          argocd app wait rpcstream-dlq-replay "${ARGOCD_COMMON[@]}" --operation --timeout 120 || true
          argocd app set rpcstream-dlq-replay "${ARGOCD_COMMON[@]}" \
            --kustomize-image "chainlake-rpcstream=${{ steps.meta.outputs.tags }}"
          argocd app sync rpcstream-dlq-replay "${ARGOCD_COMMON[@]}" --async
