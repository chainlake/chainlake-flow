logLevel: info

pipeline:
  from: "checkpoint"

chain:
  name: "bsc"
  network: "mainnet"

entities:
  - "block"
  - "transaction"
  #- "log"
  - "token_transfer"
  #- "trace" 

erpc:
  project_id: main
  base_url: http://clv001:30041 # endpoint: "http://erpc-service.erpc.svc:4000/main/evm/56"
  timeout_sec: 10
  max_retries: 1
  inflight:
    max_inflight: 20
    # latency_target_ms: 0 → fully adaptive. The controller learns the provider's
    # intrinsic (best-case) latency floor from observed traffic — cheap block/tx
    # calls on BSC (~450ms) and tiny L2 RPCs (~50ms) alike — and derives the
    # target from it, so heavy-but-healthy requests (BSC receipt/log ~1.2s) never
    # collapse concurrency and NO per-chain constant is needed. Set this to a
    # non-zero value only as an extra hard floor on top of the adaptive target.
    latency_target_ms: 0
    # Primary congestion signal is queue wait (how long a request waits for an
    # admission slot), not single-request rpc_latency. Budget defaults to 15% of
    # the adaptive target, so it scales with the environment automatically.
    queue_wait_target_ms: 0
    adjust_cooldown_windows: 3

engine:
  # Cursor ingestion worker pool size.
  # 0   = adaptive: tracks erpc.inflight.current_limit, capped at max_inflight
  #       (workers >= scheduler limit at all times; shrinks via cooperative
  #       exit when the circuit breaker trips / latency inflates).
  # 1   = serial: single worker, strict per-block order (matches eos_enabled).
  # N>1 = fixed: N long-lived workers, independent of scheduler dynamics.
  concurrency: 0
  # Kafka produce travels over the clv001<->clh001 tunnel (~74ms RTT), so a
  # 10s delivery window was too tight and flagged healthy cursors as failed.
  sink_failure_timeout_sec: 30
  sink_cooldown_sec: 15

tracker:
  # ratio of the chain block interval used to poll head updates
  poll_interval: 0.5 # default is 50% of interval_seconds from chain_profiels.yaml
  websocket_url: wss://bsc-rpc.publicnode.com

kafka:
  # ── Connection examples ─────────────────────────────────────────────────────
  #
  # 1. PLAINTEXT — no auth, no TLS (local dev / internal trusted network)
  #
  connection:
    bootstrap_servers: "localhost:30092"
  #
  # ───────────────────────────────────────────────────────────────────────────
  # 2. SASL_PLAINTEXT — SASL auth over plaintext (internal network with auth)
  #
  # connection:
  #   bootstrap_servers: "localhost:9092"
  #   security_protocol: SASL_PLAINTEXT
  #   sasl_mechanism: PLAIN          # or SCRAM-SHA-256 / SCRAM-SHA-512
  #   auth:
  #     username_env: KAFKA_USERNAME
  #     password_env: KAFKA_PASSWORD
  #
  # ───────────────────────────────────────────────────────────────────────────
  # 3. SSL — one-way TLS, no SASL (encrypt traffic, broker-side cert only)
  #
  # connection:
  #   bootstrap_servers: "localhost:9093"
  #   security_protocol: SSL
  #   ssl:
  #     ca_path_env: KAFKA_CA_PATH   # CA cert to verify the broker
  #
  # ───────────────────────────────────────────────────────────────────────────
  # 4. SASL_SSL — SASL auth over TLS (production default, e.g. Confluent Cloud)
  #
  # connection:
  #  bootstrap_servers: "localhost:30092"
  #  security_protocol: SASL_SSL
  #  sasl_mechanism: PLAIN            # or SCRAM-SHA-256 / SCRAM-SHA-512
  #  auth:
  #    username_env: KAFKA_USERNAME
  #    password_env: KAFKA_PASSWORD
  #  ssl:
  #    ca_path_env: KAFKA_CA_PATH     # omit if broker cert is signed by a public CA
  # ────────────────────────────────────────────────────────────────────────────
  common:
    topic_template: "{namespace}.{kind}_{entity}"
  producer:
    linger_ms: 50
    batch_size: 65536
    compression_type: lz4    # lz4 for realtime ingestion, zstd for backfill；zstd have higher compression rate
  streaming:
    batch_size: 100          # micro-batch size
    flush_interval_ms: 50    # max wait time
    # Sink buffer between the engine workers and the single sink worker. 100
    # was only ~11s of slack at ~9 enqueues/s, so a short broker hiccup
    # saturated it and every send began timing out.
    queue_maxsize: 400       # backpressure control
    # How long a producer waits for room in that queue before the batch counts
    # as failed. Was hardcoded at 0.1s, which turned sub-second backpressure
    # into failed cursors (-> sink cooldown -> circuit breaker trip).
    enqueue_timeout_ms: 2000
  schemaRegistry:
    enabled: true # false # if false, type and url will be discarded
    type: avro # or protobuf (default avro)
    url: "http://localhost:30081"
  eos:
    enabled: false # EOS is sensitive to network latency
    transactional_id_template: "{pipeline}.{entities}"
    init_timeout_sec: 30
    transaction_timeout_ms: 60000

telemetry:
  tracing:
    enabled: false
    endpoint: "http://localhost:4317" # http://otel-collector.observability.svc:4317
    # Probability-based trace sampling: 0.1 means each new root trace has a 1%
    # random chance to be exported. This is not "1 out of every 10 blocks" and
    # does not guarantee the first, last, or any specific block is sampled.
    # Child spans follow the parent trace decision, so a sampled block/request
    # keeps its linked RPC, processing, and Kafka spans together.
    sampleRate: 0.1

  metrics:
    enabled: false
    endpoint: "http://localhost:4317"
    export_interval_ms: 5000

  logs:
    enabled: false
    endpoint: "http://localhost:4317"
